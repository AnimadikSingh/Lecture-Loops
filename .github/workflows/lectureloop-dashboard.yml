name: Publish LectureLoop dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'materials/**'
      - '.github/workflows/lectureloop-dashboard.yml'
  workflow_run:
    workflows: ["LectureLoop material agent"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble dashboard
        run: |
          mkdir -p _site
          cp -R dashboard/. _site/
          cp -R materials _site/materials
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
